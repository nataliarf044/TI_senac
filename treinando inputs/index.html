<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Formulário</title>
</head>
<body>
    <form action="">
        <legend>Envie uma mensagem preenchendo o formulário abaixo</legend>
        <br></br>
        <label for="nome">Seu nome:</label>
        <input type="text" id="nome" name="nome" placeholder="Digite seu nome">
        <br></br>

        <label for="telefone">Seu telefone:</label>
        <input type="number" id="telefone" name="telefone" placeholder="Digite seu telefone">
        <br></br>

        <label for="email">Seu e-mail:</label>
        <input type="email" id="email" name="email" placeholder="Digite seu email">
        <br></br>

        <legend>Deseja receber nossas novidades?</legend>
        <label for="">Sim</label>
        <input type="radio" id="sim" name="opc" value="sim">
        
        <label for="">Não</label>
        <input type="radio" id="nao" name="opc" value="nao">
        <br></br>

        <label for="msg">Digite sua mensagem</label>
        <textarea name="msg" id="" rows="3" cols="20" placeholder="Mensagem*"></textarea>

        <input type="submit" value="ENVIAR">










    </form>
</body>
</html>
